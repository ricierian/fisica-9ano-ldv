<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Física 9º Ano LDV</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D4E89">
<meta name="description" content="Listas interativas de Física do 9º ano do Colégio Leonardo da Vinci Alfa, com dica e resolução passo a passo.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Física 9º">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
--bg:#EDF0F3; --surface:#FFFFFF; --ink:#141B22; --muted:#55616D; --line:#D2D9E0;
--sign:#1D4E89; --sign-ink:#FFFFFF; --lane:#F2B705; --road:#2A3037; --road-ink:#F3F5F7;
--ok:#1B7A45; --ok-bg:#E2F2E8; --bad:#B23A25; --bad-bg:#FAE8E3;
--tip-bg:#FFF5D6; --tip-ink:#5E4500; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#F3F5F8;
--f-display:'Barlow Condensed','Arial Narrow',sans-serif;
--f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0F141A; --surface:#17202A; --ink:#E6ECF2; --muted:#98A5B2; --line:#2A3542;
--sign:#2C63A8; --sign-ink:#FFFFFF; --lane:#F2C230; --road:#0A0E12; --road-ink:#F3F5F7;
--ok:#5CCB8D; --ok-bg:#15301F; --bad:#F28C74; --bad-bg:#3A1C16;
--tip-bg:#2D2610; --tip-ink:#F2D27A; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#111922; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#0F141A; --surface:#17202A; --ink:#E6ECF2; --muted:#98A5B2; --line:#2A3542;
--sign:#2C63A8; --sign-ink:#FFFFFF; --lane:#F2C230; --road:#0A0E12; --road-ink:#F3F5F7;
--ok:#5CCB8D; --ok-bg:#15301F; --bad:#F28C74; --bad-bg:#3A1C16;
--tip-bg:#2D2610; --tip-ink:#F2D27A; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#111922; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.plate{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:6px}
.plate-inner{border:2px solid var(--sign-ink);border-radius:8px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.plate h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,9vw,52px);line-height:1;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.plate p{margin:4px 0 0;font-size:17px;opacity:.95}
.road{background:var(--road);color:var(--road-ink);border-radius:10px;padding:10px 10px 12px;position:relative;overflow:hidden}
.road-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.lane{position:relative;height:26px}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--lane) 0 14px,transparent 14px 26px);opacity:.9}
.car{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .5s ease;width:34px;height:20px}
.marks{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.mk{height:32px;border-radius:5px;border:1.5px solid rgba(243,245,247,.35);background:transparent;color:var(--road-ink);font-family:var(--f-mono);font-size:13px;font-weight:600;padding:0;min-width:0}
.mk.ok{background:var(--mark-ok);border-color:var(--mark-ok)}
.mk.bad{background:var(--mark-bad);border-color:var(--mark-bad)}
.mk.cur{outline:2.5px solid var(--lane);outline-offset:1px}
.tools{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tools summary{padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.tools summary::-webkit-details-marker{display:none}
.tools summary .chev{font-family:var(--f-mono);color:var(--muted);transition:transform .2s}
.tools[open] summary .chev{transform:rotate(90deg)}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;padding:0 18px 18px}
.tool{background:var(--eq-bg);border-radius:8px;padding:12px 14px;min-width:0}
.tool h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tool div{font-size:16px;line-height:1.9}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.qnum span{color:var(--muted);font-weight:600}
.src{font-family:var(--f-mono);font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stmt{margin:0;font-size:18px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--sign)}
.opt:disabled{cursor:default}
.letter{flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--eq-bg);color:var(--ink)}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-correct .letter{background:var(--ok);color:var(--surface)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .letter{background:var(--bad);color:var(--surface)}
.opt.is-dim{opacity:.55}
.opt .tag{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.is-correct .tag{color:var(--ok)}
.opt.is-wrong .tag{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border-radius:9px;padding:11px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--sign)}
.btn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px;text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}
.tip{background:var(--tip-bg);color:var(--tip-ink);border-radius:10px;padding:12px 16px;font-size:16px}
.tip b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.feedback{border-radius:10px;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:center}
.feedback.good{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .ico{font-family:var(--f-mono);font-size:18px}
.sol{border-top:2px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sol h3{font-family:var(--f-display);font-size:28px;margin:0;line-height:1}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;counter-increment:st;min-width:0}
.step::before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.step-body{min-width:0}
.step-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 4px}
.step-body p{margin:0 0 8px}
.step-body p:last-child{margin-bottom:0}
.step-body ul{margin:0;padding-left:20px}
.eq{background:var(--eq-bg);border-radius:8px;padding:10px 14px;margin:8px 0;overflow-x:auto;white-space:nowrap;font-size:17px;line-height:2.3;font-variant-numeric:tabular-nums}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em 1px}
.frac>span:last-child{padding:2px .3em 0}
.hl{background:var(--tip-bg);color:var(--tip-ink);padding:0 .25em;border-radius:3px;font-weight:700}
.answer{display:flex;align-items:center;gap:12px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px 16px;font-weight:700}
.answer .letter{background:var(--ok);color:var(--surface)}
.alt{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;font-size:16px}
.alt b.lbl,.warn b.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}
.alt b.lbl{color:var(--sign)}
.warn{background:var(--bad-bg);border-radius:10px;padding:12px 16px;font-size:16px}
.warn b.lbl{color:var(--bad)}
.tblwrap{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--eq-bg);font-weight:700}
td.meet{background:var(--ok-bg);color:var(--ok);font-weight:700}
.intro p{margin:0}
.intro ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.score{font-family:var(--f-display);font-size:72px;line-height:.9;font-weight:700}
.score span{color:var(--muted);font-size:40px}
.reslist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.res{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface);text-align:left}
.res:hover{border-color:var(--sign)}
.res .st{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:13px}
.res.ok .st{color:var(--ok)} .res.bad .st{color:var(--bad)} .res.none .st{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
@media (max-width:480px){
body{font-size:16px}
.card{padding:18px 16px}
.stmt{font-size:17px}
.mk{font-size:11.5px;height:30px}
.marks{gap:3px}
}
@media (prefers-reduced-motion: reduce){ .car,.tools summary .chev{transition:none} }
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--sign);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.crumbs .sep{opacity:.6}
.crumbs .here{color:var(--ink);font-weight:600}
.sect-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.cards{display:flex;flex-direction:column;gap:12px}
.tile{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--sign)}
.tile:active{transform:scale(.99)}
.tile .ico{width:52px;height:52px;border-radius:10px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;border:2px solid var(--sign-ink);outline:3px solid var(--sign)}
.tile .ico.lane{background:var(--road);color:var(--lane);outline-color:var(--road);border-color:var(--lane);font-family:var(--f-mono);font-size:16px}
.tile .tt{display:block;margin:0;font-family:var(--f-display);font-size:24px;line-height:1.05}
.tile .ds{display:block;margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.tile .go{font-family:var(--f-mono);font-weight:600;color:var(--sign);font-size:20px}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.note{font-size:14.5px;color:var(--muted);margin:0}
@media (max-width:480px){.tile{grid-template-columns:44px 1fr auto;padding:14px}.tile .ico{width:44px;height:44px;font-size:20px}.tile .tt{display:block;font-size:21px}}
:root{--lvi-bg:#E1EAF6;--lvi-ink:#1D4E89;--lva-bg:#2A3037;--lva-ink:#F2B705;--plot2:#B4540A;--lvb-line:#F2B705;--lvi-line:#8DB6EA;--lva-line:#F3F5F7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lvi-bg:#1A2B44;--lvi-ink:#9CC0EE;--lva-bg:#0A0E12;--lva-ink:#F2C230;--plot2:#F2A65A}}
:root[data-theme="dark"]{--lvi-bg:#1A2B44;--lvi-ink:#9CC0EE;--lva-bg:#0A0E12;--lva-ink:#F2C230;--plot2:#F2A65A}
.lvl{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.lvl-b{background:var(--tip-bg);color:var(--tip-ink)}
.lvl-i{background:var(--lvi-bg);color:var(--lvi-ink)}
.lvl-a{background:var(--lva-bg);color:var(--lva-ink);box-shadow:inset 0 0 0 1px var(--lva-ink)}
.lvrow{display:grid;gap:4px;margin-top:6px}
.lvrow span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding-top:4px;border-top:2px solid;color:var(--road-ink);opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-b{border-color:var(--lvb-line)}.lv-i{border-color:var(--lvi-line)}.lv-a{border-color:var(--lva-line)}
.stmt{display:flex;flex-direction:column;gap:12px}
.fig{margin:4px 0 0;background:var(--eq-bg);border-radius:10px;padding:10px 8px 6px;max-width:400px;width:100%}
.plot{display:block;width:100%;height:auto}
.plot .pt{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.plot .pt-strong{fill:var(--ink);font-weight:600}
.plot .pt-lab{font-size:14px;font-weight:600}
.plot .pt-car{fill:#FFFFFF;font-size:12px;font-weight:600}
.step-body .fig{margin:8px 0}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.fld input,.fld select{font:inherit;font-weight:400;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.fld input:focus,.fld select:focus{outline:3px solid var(--lane);outline-offset:1px;border-color:var(--sign)}
#loginErro{color:var(--bad);min-height:1em;margin:0}
.fld-dica{font-weight:400;color:var(--muted);font-size:13.5px}
.emailbox{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.emailbox:focus-within{outline:3px solid var(--lane);outline-offset:1px;border-color:var(--sign)}
.fld .emailbox input{border:0;border-radius:0;outline:none}
.fld .emailbox input:focus{outline:none}
.emailbox .dom{font-size:14px;font-weight:700;color:var(--muted);background:var(--eq-bg);padding:9px 14px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.note b{overflow-wrap:anywhere}

.install{border-color:var(--sign)}
.install p{margin:0}
@media (display-mode: standalone){.wrap{padding-top:max(20px,env(safe-area-inset-top,0px))}}

</style>
</head>
<body>
<div class="wrap">
<header class="plate"><div class="plate-inner"><div class="eyebrow" id="eyebrow"></div><h1 id="ptitle"></h1><p id="psub"></p></div></header>
<nav class="crumbs" id="crumbs" aria-label="Você está em" hidden></nav>
<main id="view" style="display:flex;flex-direction:column;gap:18px"></main>
</div>
<script>
const f = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const L = ['A','B','C','D','E'];
const TOOLS = [
['Velocidade média', `v<sub>m</sub> = ${f('Δs','Δt')}`],
['Isolando', `Δs = v · Δt<br>Δt = ${f('Δs','v')}`],
['km/h ⇄ m/s', `km/h <b>÷ 3,6</b> → m/s<br>m/s <b>× 3,6</b> → km/h`],
['Tempo e distância', `1 h = 60 min = 3 600 s<br>1 km = 1 000 m`],
['Função horária (MU)', `s = s<sub>0</sub> + v · t`],
];
const Q = [
{
src:'Cesgranrio', nivel:'básico',
text:'Uma pessoa, correndo, percorre 4,0 km com velocidade escalar média de 12 km/h. O tempo do percurso é de:',
opts:['3,0 min','8,0 min','20 min','30 min','33 min'], ans:2,
hint:'Isole o tempo na fórmula: Δt = Δs ÷ v. Como a velocidade está em km/h, o resultado sai em horas.',
steps:[
['Dados', `<ul><li>Distância: Δs = 4,0 km</li><li>Velocidade: v = 12 km/h</li><li>Pede-se: Δt (as alternativas estão em minutos)</li></ul>`],
['Isolar o tempo', `<div class="eq">v = ${f('Δs','Δt')} &nbsp;⇒&nbsp; Δt = ${f('Δs','v')} = ${f('4,0 km','12 km/h')} = ${f('1','3')} h</div>`],
['Passar de horas para minutos', `<div class="eq">${f('1','3')} h = ${f('1','3')} × 60 min = <span class="hl">20 min</span></div>`],
],
alt:'A 12 km/h, a pessoa anda 12 km em 60 min, ou seja, 1 km a cada 5 min. Para 4 km: 4 × 5 = 20 min.',
warn:'⅓ h ≈ 0,33 h, mas 0,33 h <b>não</b> é 33 min! Uma hora tem 60 minutos, não 100. Quem marca e) caiu nessa armadilha.'
},
{
src:'Unicamp', nivel:'básico',
text:'Drones são veículos voadores não tripulados, controlados remotamente e guiados por GPS. Uma de suas potenciais aplicações é reduzir o tempo da prestação de primeiros socorros, levando pequenos equipamentos e instruções ao local do socorro, para que qualquer pessoa administre os primeiros cuidados até a chegada de uma ambulância. Considere um caso em que o drone ambulância se deslocou 9 km em 5 minutos. Nesse caso, o módulo de sua velocidade média é de aproximadamente:',
opts:['1,4 m/s','30 m/s','45 m/s','140 m/s'], ans:1,
hint:'As alternativas estão em m/s. Passe a distância para metros e o tempo para segundos.',
steps:[
['Dados', `<ul><li>Distância: Δs = 9 km</li><li>Tempo: Δt = 5 min</li><li>Pede-se: v<sub>m</sub> em <b>m/s</b></li></ul>`],
['Converter para o SI', `<div class="eq">9 km = 9 × 1 000 = 9 000 m</div>
<div class="eq">5 min = 5 × 60 = 300 s</div>`],
['Aplicar a fórmula', `<div class="eq">v<sub>m</sub> = ${f('9 000 m','300 s')} = <span class="hl">30 m/s</span></div>`],
],
alt:'Confira se o resultado faz sentido: 30 m/s × 3,6 = 108 km/h. É uma velocidade razoável para um drone (mais ou menos a de um carro na estrada).',
warn:'9 ÷ 5 = 1,8 dá a velocidade em km por minuto, que não é nenhuma das unidades das alternativas. Sempre confira as unidades antes de dividir.'
},

/* ===== Gráficos e esquemas (SVG gerado, segue as cores do tema) ===== */
const nf = v => String(v).replace('.', ',');
function plot(o){
  const W = 340, H = 236, l = 46, r = 18, t = 28, b = 40;
  const x0 = o.xmin || 0, y0 = o.ymin || 0;
  const sx = x => +(l + (x - x0) / (o.xmax - x0) * (W - l - r)).toFixed(1);
  const sy = y => +(H - b - (y - y0) / (o.ymax - y0) * (H - t - b)).toFixed(1);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="${o.aria}">`;
  if (o.area){ const [xa, xb, yv] = o.area; s += `<rect x="${sx(xa)}" y="${sy(yv)}" width="${sx(xb)-sx(xa)}" height="${sy(0)-sy(yv)}" fill="var(--sign)" opacity=".16"/>`; }
  o.xt.forEach(x => { s += `<line x1="${sx(x)}" y1="${sy(y0)}" x2="${sx(x)}" y2="${sy(o.ymax)}" stroke="var(--line)"/><text x="${sx(x)}" y="${sy(y0)+16}" text-anchor="middle" class="pt">${nf(x)}</text>`; });
  o.yt.forEach(y => { s += `<line x1="${sx(x0)}" y1="${sy(y)}" x2="${sx(o.xmax)}" y2="${sy(y)}" stroke="var(--line)"/><text x="${sx(x0)-7}" y="${sy(y)+4}" text-anchor="end" class="pt">${nf(y)}</text>`; });
  (o.g || []).forEach(([x, y, lab]) => {
    s += `<path d="M${sx(x0)} ${sy(y)} H${sx(x)} V${sy(y0)}" fill="none" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
    if (lab) s += `<text x="${sx(x0)-7}" y="${sy(y)+4}" text-anchor="end" class="pt pt-strong">${nf(y)}</text>`;
  });
  s += `<line x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(o.xmax)}" y2="${sy(y0)}" stroke="var(--muted)" stroke-width="1.5"/><line x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x0)}" y2="${sy(o.ymax)}" stroke="var(--muted)" stroke-width="1.5"/>`;
  s += `<text x="${W-r}" y="${H-6}" text-anchor="end" class="pt">${o.xl}</text><text x="${sx(x0)}" y="16" text-anchor="middle" class="pt">${o.yl}</text>`;
  o.L.forEach(ln => {
    s += `<polyline points="${ln.p.map(([x,y]) => sx(x)+','+sy(y)).join(' ')}" fill="none" stroke="${ln.c}" stroke-width="3" stroke-linecap="round"/>`;
    if (ln.lab){ const [x, y] = ln.lp || ln.p[ln.p.length-1]; s += `<text x="${sx(x)+(ln.lp?0:6)}" y="${sy(y)+(ln.dy||4)}" class="pt pt-lab" fill="${ln.c}">${ln.lab}</text>`; }
  });
  (o.pts || []).forEach(([x, y]) => { s += `<circle cx="${sx(x)}" cy="${sy(y)}" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`; });
  return `<figure class="fig">${s}</svg></figure>`;
}

const $ = id => document.getElementById(id);
const ID_KEY = 'fis9ldv-aluno', FILA_KEY = 'fis9ldv-fila', DIA_KEY = 'fis9ldv-ultimo-acesso';
const getAluno = () => { try { const a = JSON.parse(localStorage.getItem(ID_KEY) || 'null'); return a && a.email ? a : null; } catch(e){ return null; } };
const setAluno = a => { try { if (a) localStorage.setItem(ID_KEY, JSON.stringify(a)); else localStorage.removeItem(ID_KEY); } catch(e){} };
const precisaLogin = () => !!CONFIG.dominio && !getAluno();
function emailValido(e){ const d = CONFIG.dominio.toLowerCase().replace(/^@/, ''); return new RegExp('^[a-z0-9._%+-]+@' + d.replace(/[.]/g, '\\.') + '$').test(e); }
function enviar(ev){
  const a = getAluno(); if (!CONFIG.registro || !a) return;
  const item = Object.assign({ email: a.email, turma: a.turma, quando: new Date().toISOString(), dispositivo: /mobi|android|iphone|ipad/i.test(navigator.userAgent) ? 'celular/tablet' : 'computador' }, ev);
  let fila = []; try { fila = JSON.parse(localStorage.getItem(FILA_KEY) || '[]'); } catch(e){}
  fila.push(item); try { localStorage.setItem(FILA_KEY, JSON.stringify(fila.slice(-60))); } catch(e){}
  enviarFila();
}
let enviando = false;
async function enviarFila(){
  if (!CONFIG.registro || enviando || navigator.onLine === false) return;
  enviando = true;
  try {
    let fila = []; try { fila = JSON.parse(localStorage.getItem(FILA_KEY) || '[]'); } catch(e){}
    while (fila.length){
      await fetch(CONFIG.registro, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(fila[0]) });
      fila.shift(); try { localStorage.setItem(FILA_KEY, JSON.stringify(fila)); } catch(e){}
    }
  } catch(e){} finally { enviando = false; }
}
window.addEventListener('online', enviarFila);
function registrarAcessoDoDia(){
  const a = getAluno(); if (!CONFIG.registro || !a) return;
  const marca = a.email + '|' + new Date().toLocaleDateString('sv-SE');
  let ult = null; try { ult = localStorage.getItem(DIA_KEY); } catch(e){}
  if (ult !== marca){ enviar({ evento: 'acesso' }); try { localStorage.setItem(DIA_KEY, marca); } catch(e){} }
}
/* Tempo ativo: conta só com a lista aberta, a tela visível e o aluno interagindo (pausa após 3 min parado) */
let tMarca = null, tInter = Date.now();
['click','keydown','scroll','touchstart'].forEach(ev => window.addEventListener(ev, () => { if (LI && tMarca === null && document.visibilityState === 'visible') tMarca = Date.now(); tInter = Date.now(); }, { passive: true }));
function contarTempo(){
  if (!LI || !st || tMarca === null) return;
  const fim = Math.min(Date.now(), tInter + 180000);
  if (fim > tMarca) st.tempo = (st.tempo || 0) + (fim - tMarca) / 1000;
  tMarca = Date.now() <= tInter + 180000 ? Date.now() : null;
  store(LI.key, st);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ contarTempo(); tMarca = null; } else if (LI){ tMarca = Date.now(); tInter = Date.now(); } });
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const toTop = () => window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
const load = k => { try { const s = JSON.parse(localStorage.getItem(k) || 'null'); if (s && typeof s === 'object') return Object.assign({ answers:{}, hints:{}, cur:-1 }, s); } catch(e){} return { answers:{}, hints:{}, cur:-1 }; };
const store = (k, s) => { try { localStorage.setItem(k, JSON.stringify(s)); } catch(e){} };

let T = null, LI = null, st = null; // tema, lista e progresso atuais

function stats(l){ const s = load(l.key); let n = 0, c = 0; l.Q.forEach((q,i)=>{ const a = s.answers[i]; if (a !== undefined){ n++; if (a === q.ans) c++; } }); return { n, c, total: l.Q.length }; }

function plate(eyebrow, title, sub){

function crumbs(items){

const lvKey = n => ({'básico':'b','intermediário':'i','avançado':'a'})[n] || 'b';
function levelGroups(){
  const g = [];
  LI.Q.forEach((q, i) => { if (!q.nivel) return; const last = g[g.length-1]; if (last && last.n === q.nivel && last.end === i) last.end = i + 1; else g.push({ n: q.nivel, start: i, end: i + 1 }); });
  return g;
}
function levelRow(){
  const g = levelGroups(); if (!g.length) return '';
  return `<div class="lvrow" style="grid-template-columns:repeat(${LI.Q.length},1fr)">${g.map(x => `<span class="lv-${lvKey(x.n)}" style="grid-column:${x.start+1} / ${x.end+1}">${x.n}</span>`).join('')}</div>`;
}
function levelSummary(){
  const g = levelGroups(); if (!g.length) return '';
  const c = {}; g.forEach(x => c[x.n] = (c[x.n] || 0) + (x.end - x.start));
  return `<div class="row" style="gap:6px">${Object.keys(c).map(n => `<span class="lvl lvl-${lvKey(n)}">${c[n]} ${n === 'básico' ? (c[n]>1?'básicas':'básica') : n === 'intermediário' ? (c[n]>1?'intermediárias':'intermediária') : (c[n]>1?'avançadas':'avançada')}</span>`).join('')}</div>`;
}
const save = () => store(LI.key, st);
function resumoLista(){
  const porNivel = n => { const idx = LI.Q.map((q,i) => i).filter(i => LI.Q[i].nivel === n); return idx.length ? idx.filter(i => status(i) === 'ok').length + '/' + idx.length : ''; };
  return {
    evento: 'lista concluída', tema: T.nome, lista: 'Lista ' + LI.num,
    acertos: correctCount(), total: LI.Q.length,
    basico: porNivel('básico'), intermediario: porNivel('intermediário'), avancado: porNivel('avançado'),
    erradas: LI.Q.map((q,i) => i).filter(i => status(i) !== 'ok').map(i => i + 1).join(', '),
    dicas: Object.keys(st.hints || {}).filter(k => st.hints[k]).length,
    tempoMin: Math.round((st.tempo || 0) / 6) / 10
  };
}
function status(i){ const a = st.answers[i]; if (a === undefined) return 'none'; return a === LI.Q[i].ans ? 'ok' : 'bad'; }
function correctCount(){ return LI.Q.reduce((n,_,i)=> n + (status(i)==='ok'?1:0), 0); }
function answeredCount(){ return LI.Q.reduce((n,_,i)=> n + (status(i)!=='none'?1:0), 0); }

function renderRoad(){
  const Q = LI.Q;
  $('marks').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    const cls = ['mk', s==='ok'?'ok':s==='bad'?'bad':'', st.cur===i?'cur':''].join(' ');
    const lab = s==='ok'?'certa':s==='bad'?'errada':'não respondida';
    return `<button class="${cls}" data-go="${i}" aria-label="Questão ${i+1}, ${lab}">${i+1}</button>`;
  }).join('');
  const pos = st.cur < 0 ? 0 : st.cur >= Q.length ? Q.length - 0.5 : st.cur + 0.5;
  $('car').style.left = `calc(${(pos/Q.length)*100}% + ${st.cur<0?17:0}px)`;
  const n = answeredCount();
  $('roadLabel').textContent = st.cur>=0 && st.cur<Q.length ? `Questão ${st.cur+1} de ${Q.length}` : `Percurso: ${Q.length} questões`;
  $('roadScore').textContent = n ? `${correctCount()} de ${n} certas` : '';
}

function renderIntro(){
  const Q = LI.Q, n = answeredCount();
  $('qa').innerHTML = `
  <section class="card intro">
    <div class="qnum">Antes de começar</div>
    <p>São <b>${Q.length} questões</b> sobre ${LI.titulo.toLowerCase()}. ${LI.intro || ''}</p>${levelSummary()}
    <ul>
      <li>Responda uma questão por vez. Logo depois, aparece a <b>resolução detalhada</b>, passo a passo.</li>
      <li>Travou? Use o botão <b>Ver dica</b> antes de responder.</li>
      <li>A <b>caixa de ferramentas</b> acima tem as fórmulas e conversões que você vai usar.</li>
      <li>Tenha papel e lápis à mão e tente resolver antes de clicar na alternativa.</li>
    </ul>
    <div class="row">
      <button class="btn primary" id="startBtn">${n && n < Q.length ? 'Continuar de onde parei' : n === Q.length ? 'Ver meu resultado' : 'Começar a questão 1'}</button>
      ${n ? `<span class="small">${n} de ${Q.length} questões respondidas neste aparelho.</span>` : ''}
    </div>
  </section>`;
  $('startBtn').onclick = () => {
    if (n === Q.length) goQ(Q.length);
    else { const next = Q.findIndex((_,i)=>status(i)==='none'); goQ(next < 0 ? 0 : next); }
  };
}

function renderQuestion(i){
  const Q = LI.Q, q = Q[i], a = st.answers[i], done = a !== undefined, skipped = a === -1;
  const opts = q.opts.map((o,k)=>{
    let cls = 'opt', tag = '';
    if (done){
      if (k === q.ans){ cls += ' is-correct'; tag = '<span class="tag">✓ correta</span>'; }
      else if (k === a){ cls += ' is-wrong'; tag = '<span class="tag">✗ sua resposta</span>'; }
      else cls += ' is-dim';
    }
    return `<li><button class="${cls}" data-pick="${k}" ${done?'disabled':''}><span class="letter">${L[k]}</span><span>${o}</span>${tag}</button></li>`;
  }).join('');
  let fb = '';
  if (done){
    fb = a === q.ans
      ? `<div class="feedback good" role="status"><span class="ico">✓</span>Correto! Confira a resolução para ver se o seu raciocínio bate.</div>`
      : skipped
        ? `<div class="feedback bad" role="status"><span class="ico">→</span>Sem problema. Acompanhe a resolução com calma e tente refazer no papel.</div>`
        : `<div class="feedback bad" role="status"><span class="ico">✗</span>Não foi dessa vez. A resposta certa é a ${L[q.ans]}. Veja onde o raciocínio muda.</div>`;
  }
  const sol = done ? `
    <section class="sol" aria-label="Resolução detalhada">
      <h3>Resolução detalhada</h3>
      <ol class="steps">
        ${q.steps.map(([lab,html])=>`<li class="step"><div class="step-body"><div class="step-label">${lab}</div>${html}</div></li>`).join('')}
      </ol>
      <div class="answer"><span class="letter">${L[q.ans]}</span><span>Resposta: alternativa ${L[q.ans]} (${q.opts[q.ans]})</span></div>
      ${q.alt ? `<div class="alt"><b class="lbl">Outro jeito de pensar</b>${q.alt}</div>` : ''}
      ${q.warn ? `<div class="warn"><b class="lbl">Cuidado com a pegadinha</b>${q.warn}</div>` : ''}
    </section>` : '';
  const showHint = st.hints[i] && !done;
  const last = i === Q.length - 1;
  $('qa').innerHTML = `
  <article class="card">
    <div class="qhead">
      <div class="qnum">Questão ${i+1} <span>/ ${Q.length}</span></div>
      <span class="row" style="gap:6px">${q.nivel ? `<span class="lvl lvl-${lvKey(q.nivel)}">Nível ${q.nivel}</span>` : ''}<span class="src">${q.src}</span></span>
    </div>
    <div class="stmt">${q.text}</div>
    <ul class="opts">${opts}</ul>
    ${!done ? `<div class="row">
        ${showHint ? '' : `<button class="btn" id="hintBtn">Ver dica</button>`}
        <span class="spacer"></span>
        <button class="btn ghost" id="skipBtn">Não sei, mostrar a resolução</button>
      </div>` : ''}
    ${showHint ? `<div class="tip"><b>Dica</b>${q.hint}</div>` : ''}
    ${fb}
    ${sol}
    <div class="row">
      ${i > 0 ? `<button class="btn" id="prevBtn">← Anterior</button>` : ''}
      <span class="spacer"></span>
      ${done ? `<button class="btn primary" id="nextBtn">${last ? 'Ver meu resultado' : 'Próxima questão →'}</button>`
             : (!last ? `<button class="btn ghost" id="jumpBtn">Pular por enquanto</button>` : '')}
    </div>
  </article>`;
  $('qa').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => answer(i, +b.dataset.pick));
  const h = $('hintBtn'); if (h) h.onclick = () => { st.hints[i] = true; save(); renderQuestion(i); };
  const s = $('skipBtn'); if (s) s.onclick = () => answer(i, -1);
  const p = $('prevBtn'); if (p) p.onclick = () => goQ(i - 1);
  const n = $('nextBtn'); if (n) n.onclick = () => goQ(i + 1);
  const j = $('jumpBtn'); if (j) j.onclick = () => goQ(i + 1);
}

function answer(i, k){
  if (st.answers[i] !== undefined) return;
  st.answers[i] = k; save();
  if (answeredCount() === LI.Q.length && !st.enviado){ contarTempo(); st.enviado = true; save(); enviar(resumoLista()); }
  renderRoad(); renderQuestion(i);
  const fb = $('qa').querySelector('.feedback');
  if (fb) fb.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

function renderEnd(){
  const Q = LI.Q, c = correctCount(), n = answeredCount();
  const msg = n < Q.length
    ? `Você ainda tem ${Q.length - n} questão(ões) sem responder. Toque nelas abaixo para terminar.`
    : c >= Math.ceil(Q.length * 0.9) ? 'Excelente! Você domina este conteúdo. Releia as pegadinhas para chegar ao teste ainda mais seguro.'
    : c >= Math.ceil(Q.length * 0.6) ? 'Bom trabalho. Revise as questões que errou, com atenção especial às conversões de unidades: é onde mais se perde ponto.'
    : 'Vale revisar a caixa de ferramentas e refazer as questões com calma, acompanhando cada passo da resolução, antes do teste.';
  $('qa').innerHTML = `
  <section class="card">
    <div class="qnum">Resultado</div>
    <div class="score">${c}<span> / ${Q.length}</span></div>
    <p style="margin:0">${msg}</p>
    <ul class="reslist">
      ${Q.map((q,i)=>{ const s = status(i); const t = s==='ok'?'✓ certa':s==='bad'?(st.answers[i]===-1?'→ vista':'✗ errada'):'— pendente';
        return `<li><button class="res ${s}" data-go="${i}"><b>Questão ${i+1}</b><span class="st">${t}</span></button></li>`; }).join('')}
    </ul>
    <div class="row">
      <button class="btn" id="resetBtn">Refazer a lista do zero</button>
      <button class="btn primary" data-nav="tema">Voltar para ${T.nome}</button>
      <span class="small" id="resetNote"></span>
    </div>
  </section>`;
  const r = $('resetBtn'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.textContent = 'Confirmar: apagar minhas respostas'; $('resetNote').textContent = 'Toque de novo para confirmar.'; return; }
    st = { answers:{}, hints:{}, cur:-1, tempo:0 }; save(); goQ(-1);
  };
}

function goQ(i){
  st.cur = i; save();
  renderRoad();
  if (i < 0) renderIntro();
  else if (i >= LI.Q.length) renderEnd();
  else renderQuestion(i);
  toTop();
}

/* ===== Navegação com endereço próprio (#/tema/lista) e botão Voltar do celular ===== */
function go(h){ if (location.hash === h) route(); else location.hash = h; }
function openLogin(){
  contarTempo(); tMarca = null; T = LI = null;
  plate(`Física · ${SITE.escola}`, SITE.turma, `${SITE.turmas} · ${SITE.prof}`);
  crumbs(null);
  $('view').innerHTML = `
    <form class="card intro" id="loginForm" novalidate>
      <p class="sect-label">Identificação</p>
      <p>Para usar as listas, informe o seu <b>e-mail do colégio</b> e a sua turma. Você só faz isso uma vez neste aparelho.</p>
      <label class="fld"><span>E-mail do colégio <small class="fld-dica">(só a parte antes do @)</small></span>
        <span class="emailbox">
          <input id="loginEmail" type="text" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="nome.sobrenome" required>
          <span class="dom" aria-hidden="true">@${CONFIG.dominio.replace('.', '.<wbr>')}</span>
        </span></label>
      <label class="fld"><span>Turma</span>
        <select id="loginTurma" required><option value="">Escolha</option>${CONFIG.turmas.map(t => `<option value="${t}">${t}</option>`).join('')}</select></label>
      <p class="small" id="loginErro" role="alert"></p>
      <div class="row"><button class="btn primary" type="submit">Entrar</button></div>
      <p class="note">O professor recebe o seu e-mail, a turma, a data de acesso e os resultados das listas (acertos, tempo e dicas usadas), só para acompanhar os estudos da turma.</p>
    </form>`;
  $('loginForm').onsubmit = e => {
    e.preventDefault();
    let usuario = $('loginEmail').value.trim().toLowerCase().replace(/\s+/g, '');
    const dom = '@' + CONFIG.dominio.toLowerCase().replace(/^@/, '');
    if (usuario.endsWith(dom)) usuario = usuario.slice(0, -dom.length);   // se digitou o e-mail inteiro, aproveita
    const email = usuario + dom, turma = $('loginTurma').value;
    if (!usuario){ $('loginErro').textContent = 'Escreva a parte do seu e-mail antes do @.'; $('loginEmail').focus(); return; }
    if (usuario.includes('@') || !emailValido(email)){ $('loginErro').textContent = `Escreva só a parte antes do @. O resto (${dom}) já está preenchido.`; $('loginEmail').focus(); return; }
    if (!turma){ $('loginErro').textContent = 'Escolha a sua turma.'; $('loginTurma').focus(); return; }
    setAluno({ email, turma }); registrarAcessoDoDia(); route();
  };
  toTop();
}
function route(){
  if (precisaLogin()){ openLogin(); return; }
  registrarAcessoDoDia(); enviarFila();
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const ti = SITE.temas.findIndex(t => t.id === p[0]);
  if (ti < 0){ openHome(); return; }
  if (!p[1]){ openTema(ti); return; }
  const li = SITE.temas[ti].listas.findIndex(l => l.id === p[1]);
  if (li < 0){ openTema(ti); return; }
  T = SITE.temas[ti]; openLista(li);
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act="sair"]'); if (act){ setAluno(null); try { localStorage.removeItem(DIA_KEY); } catch(err){} go('#/'); route(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav){ go(nav.dataset.nav === 'tema' && T ? '#/' + T.id : '#/'); return; }
  const t = e.target.closest('[data-tema]'); if (t){ go('#/' + SITE.temas[+t.dataset.tema].id); return; }
  const l = e.target.closest('[data-lista]'); if (l){ go('#/' + T.id + '/' + T.listas[+l.dataset.lista].id); return; }
  const g = e.target.closest('[data-go]'); if (g && LI){ goQ(+g.dataset.go); }
});

/* ===== Instalação como aplicativo ===== */
let installEvt = null;
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; const c = $('installCard'); if (c) c.hidden = true; });
function showInstall(){
  const c = $('installCard'); if (!c || standalone()) return;
  if (installEvt){
    c.hidden = false;
    c.innerHTML = `<p class="sect-label">Instale no celular</p><p>Tenha as listas como um aplicativo: ícone na tela inicial e funcionando mesmo sem internet.</p><div class="row"><button class="btn primary" id="instBtn">Instalar o app</button></div>`;
    $('instBtn').onclick = async () => { installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; c.hidden = true; };
  } else if (isIOS){
    c.hidden = false;
    c.innerHTML = `<p class="sect-label">Instale no iPhone</p><p>No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta para cima) e depois em <b>Adicionar à Tela de Início</b>.</p>`;
  }
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
route();
</script>
